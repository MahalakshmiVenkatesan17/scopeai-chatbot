name: Deploy to Railway

on:
  push:
    branches:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      adminpanel: ${{ steps.filter.outputs.adminpanel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'ai-chatbot-frontend/ai-chatbot-frontend/**'
            backend:
              - 'ai-chatbot-backend/ai-chatbot-backend/**'
            adminpanel:
              - 'ai-chatbot-adminpanel/ai-chatbot-admin/**'

  deploy-frontend:
    name: Deploy Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    defaults:
      run:
        working-directory: ai-chatbot-frontend/ai-chatbot-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Railway
        run: railway up --service=${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }} --ci

  deploy-backend:
    name: Deploy Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    defaults:
      run:
        working-directory: ai-chatbot-backend/ai-chatbot-backend
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to Railway
        run: railway up --service=${{ secrets.RAILWAY_BACKEND_SERVICE_ID }} --ci

  deploy-adminpanel:
    name: Deploy Admin Panel
    needs: changes
    if: needs.changes.outputs.adminpanel == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    defaults:
      run:
        working-directory: ai-chatbot-adminpanel/ai-chatbot-admin
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Admin Panel to Railway
        run: railway up --service=${{ secrets.RAILWAY_ADMINPANEL_SERVICE_ID }} --ci
