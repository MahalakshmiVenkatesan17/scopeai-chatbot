name: Deploy Next.js to Railway

on:
  push:
    branches:
      - master
    paths:
      - 'ai-chatbot-frontend/ai-chatbot-frontend/**'  # Only trigger on frontend changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SVC_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

    defaults:
      run:
        working-directory: ai-chatbot-frontend/ai-chatbot-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: railway up --service=${{ env.SVC_ID }} --detach
