<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Weaviate Explorer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f4f5; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; border-bottom: 2px solid #e4e4e7; padding-bottom: 10px; margin-bottom: 20px; }
        .chunk { border: 1px solid #e4e4e7; border-radius: 6px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .property { margin-bottom: 5px; font-size: 14px; }
        .property strong { color: #2563eb; }
        .content { margin-top: 10px; font-size: 13px; color: #555; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 4px; max-height: 100px; overflow-y: auto;}
        .button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .button:hover { background: #1d4ed8; }
        .meta { font-size: 12px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Weaviate Production Explorer</h1>
        <p>This tool fetches up to <strong>10,000</strong> document chunks directly from your Railway Weaviate database. You can instantly see when a new document is uploaded or when it is deleted.</p>
        
        <button class="button" onclick="fetchLatestChunks()">🔄 Refresh Latest Chunks</button>
        
        <div id="loading" style="display: none; margin-top: 20px; font-weight: bold; color: #2563eb;">Fetching from Railway...</div>
        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        const WEAVIATE_GRAPHQL_URL = "https://weaviate-production-a833.up.railway.app/v1/graphql";

        async function fetchLatestChunks() {
            const resultsDiv = document.getElementById("results");
            const loadingDiv = document.getElementById("loading");
            
            loadingDiv.style.display = "block";
            resultsDiv.innerHTML = "";

            const query = `
            {
              Get {
                DocumentChunk(
                  limit: 10000
                  sort: [{path: ["_creationTimeUnix"], order: desc}]
                ) {
                  documentId
                  documentTitle
                  documentFilename
                  categoryName
                  content
                  _additional {
                    id
                    creationTimeUnix
                  }
                }
              }
            }`;

            try {
                const response = await fetch(WEAVIATE_GRAPHQL_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                });

                const json = await response.json();
                loadingDiv.style.display = "none";

                if (json.errors) {
                    resultsDiv.innerHTML = `<div style="color:red;">Error: ${json.errors[0].message}</div>`;
                    return;
                }

                const chunks = json.data.Get.DocumentChunk;
                
                if (!chunks || chunks.length === 0) {
                    resultsDiv.innerHTML = `<p>No document chunks found.</p>`;
                    return;
                }

                chunks.forEach(chunk => {
                    const date = new Date(parseInt(chunk._additional.creationTimeUnix)).toLocaleString();
                    
                    const el = document.createElement("div");
                    el.className = "chunk";
                    el.innerHTML = `
                        <div class="meta">Created: ${date} | Vector ID: ${chunk._additional.id}</div>
                        <div class="property"><strong>Document ID:</strong> ${chunk.documentId || "N/A"}</div>
                        <div class="property"><strong>Title:</strong> ${chunk.documentTitle || "<i>Empty</i>"}</div>
                        <div class="property"><strong>Filename:</strong> ${chunk.documentFilename || "<i>Empty</i>"}</div>
                        <div class="property"><strong>Category:</strong> ${chunk.categoryName || "<i>Empty</i>"}</div>
                        <div class="content">${chunk.content}</div>
                    `;
                    resultsDiv.appendChild(el);
                });

            } catch (error) {
                loadingDiv.style.display = "none";
                resultsDiv.innerHTML = `<div style="color:red;">Failed to connect to Weaviate: ${error.message}</div>`;
            }
        }

        // Auto-load on page open
        fetchLatestChunks();
    </script>
</body>
</html>
