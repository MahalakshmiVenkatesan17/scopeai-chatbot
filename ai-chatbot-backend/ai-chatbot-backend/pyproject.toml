[project]
name = "ai-chatbot-backend"
version = "1.0.0"
description = "AI Chatbot SaaS Backend - FastAPI + LangGraph + OpenAI + Weaviate"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
